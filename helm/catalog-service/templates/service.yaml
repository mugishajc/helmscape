apiVersion: v1
kind: Service
metadata:
  name: {{ include "catalog-service.name" . }}
  labels: {{- include "catalog-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "catalog-service.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
