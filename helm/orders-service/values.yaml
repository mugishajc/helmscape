replicaCount: 2

image:
  repository: ghcr.io/mugishajc/orders-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

env:
  CATALOG_URL: http://catalog-service:8000

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits:   { cpu: 500m, memory: 256Mi }

service:
  port: 8000

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
