apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mugishajc/helmscape.git
    targetRevision: main
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: shop-production
  # Manual sync for production. Flip to automated once the staging soak is clean.
  syncPolicy:
    syncOptions: [CreateNamespace=true]
