apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-production
resources:
  - ../../base
images:
  - name: ghcr.io/mugishajc/catalog-service
    newTag: 0.1.0
  - name: ghcr.io/mugishajc/orders-service
    newTag: 0.1.0
  - name: ghcr.io/mugishajc/users-service
    newTag: 0.1.0
patches:
  - target: { kind: Deployment, name: catalog-service }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: Deployment, name: orders-service }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: Deployment, name: users-service }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
