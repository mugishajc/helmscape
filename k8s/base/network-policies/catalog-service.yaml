apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-catalog-service
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: catalog-service }
  policyTypes: [Ingress, Egress]
  ingress:
    # Accept traffic from orders-service and from Prometheus scraping.
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: orders-service }
      ports: [{ port: 8000, protocol: TCP }]
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ port: 8000, protocol: TCP }]
  egress:
    # DNS resolution.
    - to:
        - namespaceSelector: {}
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
